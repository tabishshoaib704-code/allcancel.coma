<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 16px;
        }
        .wrap { width: 100%; max-width: min(560px, (100vh - 170px) * 0.8); min-width: 0; }
        h1 { text-align: center; font-size: 2rem; letter-spacing: .05em; margin-bottom: .75rem; }
        h1 span { color: var(--accent); }
        .hud {
            display: flex; justify-content: space-between; background: var(--panel);
            padding: .6rem 1rem; border-radius: 12px 12px 0 0; font-weight: 700;
        }
        .hud b { color: var(--accent); }
        .stage { position: relative; }
        canvas {
            display: block; width: 100%; aspect-ratio: 4 / 5; background: #020617;
            border-radius: 0 0 12px 12px; touch-action: none; cursor: none;
        }
        .overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 1rem; text-align: center; padding: 1.5rem;
            background: rgba(2, 6, 23, .85); border-radius: 0 0 12px 12px;
        }
        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 1.8rem; }
        .overlay p { color: var(--muted); line-height: 1.6; }
        button {
            font: inherit; font-weight: 700; font-size: 1.1rem; border: none; border-radius: 8px;
            padding: .8rem 2rem; background: var(--accent); color: #111; cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        .help { text-align: center; color: var(--muted); font-size: .9rem; margin-top: .75rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>BRICK <span>BREAKER</span></h1>
        <div class="hud">
            <span>Score <b id="score">0</b></span>
            <span>Level <b id="level">1</b></span>
            <span>Lives <b id="lives">3</b></span>
            <span>Best <b id="best">0</b></span>
        </div>
        <div class="stage">
            <canvas id="game" width="480" height="600"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="ov-title">Ready?</h2>
                <p id="ov-text">Smash every brick to clear the level.<br>Catch falling power-ups: <b style="color:#22d3ee">W</b>ide paddle, <b style="color:#a3e635">M</b>ulti-ball, <b style="color:#f472b6">S</b>low ball.</p>
                <button id="start">Play</button>
            </div>
        </div>
        <p class="help">Move: mouse, touch, or ← → / A D &nbsp;·&nbsp; Launch: click, tap, or Space &nbsp;·&nbsp; Pause: P</p>
    </div>

    <script>
    (() => {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const $ = id => document.getElementById(id);

        const COLS = 8, BRICK_H = 20, BRICK_GAP = 6, TOP = 60;
        const BRICK_W = (W - BRICK_GAP * (COLS + 1)) / COLS;
        const ROW_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#22c55e', '#06b6d4', '#6366f1', '#a855f7'];
        const POWERS = { W: '#22d3ee', M: '#a3e635', S: '#f472b6' };
        const BASE_PADDLE = 90;

        let best = 0;
        try { best = +localStorage.getItem('brickBreakerBest') || 0; } catch (e) {}
        $('best').textContent = best;

        const keys = {};
        let paddle, balls, bricks, drops, particles;
        let score, lives, level, state = 'menu', last, wideTimer = 0, slowTimer = 0;

        function hud() {
            $('score').textContent = score;
            $('lives').textContent = lives;
            $('level').textContent = level;
        }

        function buildLevel() {
            bricks = [];
            const rows = Math.min(4 + level, 7);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < COLS; c++) {
                    // later levels get gaps in patterns and tougher bricks
                    if (level >= 2 && (r + c + level) % 7 === 0) continue;
                    const hp = level >= 3 && r < level - 2 ? 2 : 1;
                    bricks.push({
                        x: BRICK_GAP + c * (BRICK_W + BRICK_GAP),
                        y: TOP + r * (BRICK_H + BRICK_GAP),
                        hp, color: ROW_COLORS[r % ROW_COLORS.length],
                    });
                }
            }
        }

        function ballSpeed() { return (300 + level * 25) * (slowTimer > 0 ? 0.65 : 1); }

        function resetBall() {
            balls = [{ x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, r: 7, stuck: true }];
            drops = [];
            wideTimer = slowTimer = 0;
            paddle.w = BASE_PADDLE;
        }

        function newGame() {
            score = 0; lives = 3; level = 1;
            paddle = { x: W / 2, y: H - 30, w: BASE_PADDLE, h: 12 };
            particles = [];
            buildLevel();
            resetBall();
            hud();
        }

        function launch() {
            for (const b of balls) {
                if (!b.stuck) continue;
                const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
                const s = ballSpeed();
                b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; b.stuck = false;
            }
        }

        function burst(x, y, color, n = 10) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 160;
                particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
            }
        }

        function hitBrick(br) {
            br.hp--;
            if (br.hp > 0) { burst(br.x + BRICK_W / 2, br.y + BRICK_H / 2, '#fff', 4); return; }
            bricks.splice(bricks.indexOf(br), 1);
            score += 10 * level;
            burst(br.x + BRICK_W / 2, br.y + BRICK_H / 2, br.color);
            if (Math.random() < 0.14) {
                const kinds = Object.keys(POWERS);
                drops.push({ x: br.x + BRICK_W / 2, y: br.y, kind: kinds[Math.floor(Math.random() * kinds.length)] });
            }
            hud();
        }

        function applyPower(kind) {
            score += 25;
            if (kind === 'W') { wideTimer = 12; paddle.w = BASE_PADDLE * 1.6; }
            if (kind === 'S') { slowTimer = 10; rescaleBalls(); }
            if (kind === 'M') {
                const extra = [];
                for (const b of balls.slice(0, 3)) {
                    for (const da of [-0.4, 0.4]) {
                        const a = Math.atan2(b.vy || -1, b.vx) + da, s = ballSpeed();
                        extra.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: b.r, stuck: b.stuck });
                    }
                }
                balls.push(...extra);
            }
            hud();
        }

        function rescaleBalls() {
            const s = ballSpeed();
            for (const b of balls) {
                if (b.stuck) continue;
                const m = Math.hypot(b.vx, b.vy) || 1;
                b.vx = b.vx / m * s; b.vy = b.vy / m * s;
            }
        }

        function update(dt) {
            // paddle (keyboard)
            const dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
            paddle.x += dir * 520 * dt;
            paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

            if (wideTimer > 0 && (wideTimer -= dt) <= 0) paddle.w = BASE_PADDLE;
            if (slowTimer > 0 && (slowTimer -= dt) <= 0) rescaleBalls();

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (b.stuck) { b.x = paddle.x; b.y = paddle.y - b.r - 1; continue; }

                // sub-step so fast balls don't tunnel through bricks
                const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4);
                for (let s = 0; s < steps; s++) {
                    b.x += b.vx * dt / steps;
                    b.y += b.vy * dt / steps;

                    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
                    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
                    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }

                    // paddle: bounce angle depends on where the ball lands
                    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
                        Math.abs(b.x - paddle.x) <= paddle.w / 2 + b.r) {
                        const rel = (b.x - paddle.x) / (paddle.w / 2);
                        const a = -Math.PI / 2 + Math.max(-1, Math.min(1, rel)) * 1.05;
                        const sp = ballSpeed();
                        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
                        b.y = paddle.y - b.r;
                    }

                    for (const br of bricks) {
                        const cx = Math.max(br.x, Math.min(b.x, br.x + BRICK_W));
                        const cy = Math.max(br.y, Math.min(b.y, br.y + BRICK_H));
                        const dx = b.x - cx, dy = b.y - cy;
                        if (dx * dx + dy * dy <= b.r * b.r) {
                            if (Math.abs(dx) > Math.abs(dy)) { b.vx = Math.sign(dx || -b.vx) * Math.abs(b.vx); b.x = cx + Math.sign(dx || 1) * b.r; }
                            else { b.vy = Math.sign(dy || -b.vy) * Math.abs(b.vy); b.y = cy + Math.sign(dy || 1) * b.r; }
                            hitBrick(br);
                            break;
                        }
                    }
                }

                if (b.y - b.r > H) balls.splice(i, 1);
            }

            if (balls.length === 0) {
                lives--; hud();
                if (lives <= 0) return endGame(false);
                resetBall();
            }

            for (let i = drops.length - 1; i >= 0; i--) {
                const d = drops[i];
                d.y += 150 * dt;
                if (d.y + 10 >= paddle.y && d.y - 10 <= paddle.y + paddle.h && Math.abs(d.x - paddle.x) <= paddle.w / 2 + 10) {
                    applyPower(d.kind); burst(d.x, d.y, POWERS[d.kind], 14); drops.splice(i, 1);
                } else if (d.y > H + 20) drops.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (bricks.length === 0) {
                level++;
                score += 100 * lives;
                buildLevel(); resetBall(); hud();
                showOverlay('Level ' + level, 'Bonus +' + (100 * lives) + '. Bricks get tougher and the ball gets faster.', 'Continue');
                state = 'between';
            }
        }

        function rect(x, y, w, h, r) {
            ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            for (const br of bricks) {
                ctx.fillStyle = br.color;
                rect(br.x, br.y, BRICK_W, BRICK_H, 4);
                if (br.hp > 1) {
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.strokeRect(br.x + 3, br.y + 3, BRICK_W - 6, BRICK_H - 6);
                }
            }

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 13px system-ui, sans-serif';
            for (const d of drops) {
                ctx.fillStyle = POWERS[d.kind];
                ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#020617'; ctx.fillText(d.kind, d.x, d.y + 1);
            }

            ctx.fillStyle = wideTimer > 0 ? POWERS.W : '#f59e0b';
            rect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6);

            ctx.fillStyle = slowTimer > 0 ? POWERS.S : '#f8fafc';
            for (const b of balls) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }

            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life / 0.5, 0);
                ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            }
            ctx.globalAlpha = 1;

            if (state === 'playing' && balls.some(b => b.stuck)) {
                ctx.fillStyle = '#94a3b8'; ctx.font = '15px system-ui, sans-serif';
                ctx.fillText('Click, tap, or press Space to launch', W / 2, H / 2 + 60);
            }
            if (state === 'paused') {
                ctx.fillStyle = 'rgba(2,6,23,.6)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 32px system-ui, sans-serif';
                ctx.fillText('PAUSED', W / 2, H / 2);
            }
        }

        function loop(t) {
            const dt = Math.min((t - last) / 1000, 0.033);
            last = t;
            if (state === 'playing') update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function showOverlay(title, text, btn) {
            $('ov-title').textContent = title;
            $('ov-text').textContent = text;
            $('start').textContent = btn;
            $('overlay').classList.remove('hidden');
        }

        function endGame() {
            state = 'over';
            const isBest = score > best;
            if (isBest) {
                best = score; $('best').textContent = best;
                try { localStorage.setItem('brickBreakerBest', best); } catch (e) {}
            }
            showOverlay(isBest ? 'New High Score!' : 'Game Over', 'You reached level ' + level + ' with ' + score + ' points.', 'Play Again');
        }

        $('start').addEventListener('click', () => {
            if (state === 'menu' || state === 'over') newGame();
            $('overlay').classList.add('hidden');
            state = 'playing';
        });

        function pointerX(e) {
            const r = canvas.getBoundingClientRect();
            return (e.clientX - r.left) * W / r.width;
        }
        canvas.addEventListener('pointermove', e => { if (paddle) paddle.x = pointerX(e); });
        canvas.addEventListener('pointerdown', e => {
            if (state !== 'playing') return;
            paddle.x = pointerX(e);
            launch();
        });

        document.addEventListener('keydown', e => {
            keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
            if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
            if (e.key === ' ' && state === 'playing') launch();
            if ((e.key === 'p' || e.key === 'P') && (state === 'playing' || state === 'paused')) {
                state = state === 'playing' ? 'paused' : 'playing';
            }
        });
        document.addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

        newGame();
        last = performance.now();
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
